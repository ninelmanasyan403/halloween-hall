<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Зал славы хэллоуинского конкурса: питомцы в костюмах и подписи к фотографиям.">
  <title>Хвостатый Хэллоуин</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312110f'/%3E%3Cellipse cx='16' cy='19' rx='7' ry='6' fill='%23c4845c'/%3E%3Cpath d='M16 8c1 3 2 3 2 3s-2 1-2 3c0-2-2-3-2-3s1 0 2-3z' fill='%236e8f6a'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #12110f;
      --card: #1b1a17;
      --frame: #0c0b0a;
      --text: #f3ece4;
      --muted: #a79b91;
      --soft: #c4b4a8;
      --line: rgba(243, 236, 228, 0.12);
      --accent: #c4845c;
      --accent-ink: #1a120e;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--text);
      background: #12110f;
      font-family: "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #6a4634; color: #fff8f1; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 48px;
    }

    header { text-align: center; margin-bottom: 34px; }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
    }

    h1 {
      margin: 10px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(36px, 6vw, 58px);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h1::after {
      content: "";
      display: block;
      width: 42px;
      height: 2px;
      margin: 16px auto 0;
      background: var(--accent);
    }

    .count {
      margin: 14px 0 0;
      color: var(--soft);
      font-size: 14px;
    }

    .banner {
      margin: 0 0 22px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #2a211c;
      color: #f0e2d4;
      border: 1px solid rgba(196, 132, 92, 0.35);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 0 0 22px;
    }

    .filters button,
    .text-btn,
    .primary,
    .quiet,
    .music,
    .lb-bar button {
      font: inherit;
      cursor: pointer;
    }

    .filters button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--soft);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .filters button[aria-pressed="true"] {
      background: #2a2420;
      color: var(--text);
      border-color: rgba(196, 132, 92, 0.7);
    }

    .grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px 22px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover { border-color: rgba(196, 132, 92, 0.45); transform: translateY(-2px); }

    .open {
      display: block;
      width: 100%;
      margin: 0;
      padding: 12px 12px 16px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .frame {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 14px;
      border-radius: 10px;
      background: var(--frame);
      border: 8px solid #6e3d2c;
      box-shadow:
        inset 0 0 0 2px #e4d0b0,
        inset 0 0 0 6px #1a120e,
        0 0 0 1px #c4845c;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 4px;
      pointer-events: none;
      background:
        radial-gradient(circle at 0 0, #e4d0b0 0 3.5px, transparent 4px),
        radial-gradient(circle at 100% 0, #e4d0b0 0 3.5px, transparent 4px),
        radial-gradient(circle at 0 100%, #e4d0b0 0 3.5px, transparent 4px),
        radial-gradient(circle at 100% 100%, #e4d0b0 0 3.5px, transparent 4px);
    }

    .frame img,
    #lb-img,
    .drop img,
    .row img {
      display: block;
      max-width: 100%;
    }

    .frame img {
      max-height: 440px;
      width: auto;
      object-fit: contain;
    }

    .fresh {
      display: inline-block;
      margin: 12px 0 0;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .name {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.1;
    }

    .costume {
      display: block;
      margin-top: 4px;
      color: #c4a090;
      font-size: 14px;
    }

    .caption {
      display: block;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 17px;
      line-height: 1.45;
    }

    .sender {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .card-actions {
      display: flex;
      gap: 14px;
      padding: 0 14px 14px;
    }

    .perch {
      display: block;
      width: min(400px, 92vw);
      margin: 36px auto 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .perch:focus-visible {
      outline: 1px solid rgba(228, 208, 176, 0.7);
      outline-offset: 8px;
    }

    .perch-scene {
      position: relative;
      width: min(400px, 92vw);
    }

    .perch-glow {
      position: absolute;
      inset: -12% -8%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.6s ease;
    }

    .perch.purring .perch-glow {
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    .perch-glow .firefly { width: 8px; height: 8px; margin: -4px 0 0 -4px; }
    .perch-glow .firefly.tiny { width: 5px; height: 5px; margin: -2px 0 0 -2px; }

    .perch svg { width: 100%; height: auto; display: block; }

    .pumpkin { }

    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flicker 0.4s ease-in-out infinite alternate; }

    .flame.mid { animation-delay: 0.14s; }

    .flame.slow { animation-delay: 0.26s; }

    .kitty { transform-origin: 150px 100px; animation: purr 1.8s ease-in-out infinite; }

    .purr {
      position: absolute;
      left: 56%;
      top: 12%;
      color: #d7b39a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      letter-spacing: 0.08em;
      animation: murmur 2.6s ease-in-out infinite;
    }

    .scene-frame {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 3;
    }

    .scene-frame::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(196, 132, 92, 0.32);
      border-radius: 22px;
      box-shadow: inset 0 0 0 6px rgba(196, 132, 92, 0.05);
    }

    .ornament {
      position: absolute;
    }

    .ornament.tl { top: 0; left: 0; width: 210px; height: 250px; }
    .ornament.tr { top: 10px; right: 12px; width: 128px; height: 128px; }
    .ornament.bl { bottom: 0; left: 6px; width: 230px; height: 150px; }
    .ornament.br { bottom: 8px; right: 14px; width: 86px; height: 140px; }

    .spider { transform-box: view-box; transform-origin: 96px 78px; animation: dangle 3.4s ease-in-out infinite; }
    .sheet { transform-box: view-box; transform-origin: 72px 70px; animation: drift 3.2s ease-in-out infinite; }
    .wick { transform-box: fill-box; transform-origin: center bottom; animation: flicker 0.45s ease-in-out infinite alternate; }

    @keyframes dangle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes flicker {
      from { transform: scale(0.92, 0.78); opacity: 0.72; }
      to { transform: scale(1.08, 1.12); opacity: 1; }
    }

    @keyframes purr {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @keyframes murmur {
      0%, 100% { opacity: 0.15; transform: translateY(3px); }
      45%, 70% { opacity: 0.9; transform: translateY(0); }
    }

    footer {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 8px 150px 150px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    body.curtain-on { overflow: hidden; }

    .curtain {
      position: fixed;
      inset: 0;
      z-index: 40;
      cursor: pointer;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 51%;
      z-index: 1;
      transition: transform 1.15s cubic-bezier(0.7, 0.04, 0.2, 1);
      background:
        repeating-linear-gradient(
          90deg,
          #140c10 0 22px,
          #2a1620 22px 34px,
          #1a1016 34px 52px,
          #321820 52px 60px
        );
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.55);
    }

    .curtain-panel.left {
      left: 0;
      border-right: 3px solid #6a4034;
    }

    .curtain-panel.right {
      right: 0;
      border-left: 3px solid #6a4034;
    }

    .curtain-valance {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 4;
      background: linear-gradient(#3a1c24, #1a0e12 70%);
      border-bottom: 3px solid #6a4034;
      transition: transform 1.05s ease;
    }

    .curtain-mark {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 28px;
      transition: opacity 0.35s ease;
    }

    .curtain-art {
      position: relative;
      width: min(360px, 84vw);
    }

    .curtain-art img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #e7f5a4;
      box-shadow: 0 0 8px 3px rgba(186, 214, 74, 0.8);
      pointer-events: none;
      animation: firefly 4.4s ease-in-out infinite;
    }

    .firefly.tiny { width: 4px; height: 4px; margin: -2px 0 0 -2px; }

    @keyframes firefly {
      0%, 100% { opacity: 0.2; transform: translate(0, 6px) scale(0.75); }
      40% { opacity: 1; transform: translate(14px, -18px) scale(1); }
      72% { opacity: 0.35; transform: translate(-12px, -4px) scale(0.85); }
    }

    .curtain-mark p {
      margin: 16px 0 0;
      color: #e4d0b0;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.04em;
      font-size: 16px;
    }

    .sparks {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 1px;
      opacity: 0.95;
      box-shadow: 0 0 0 1px rgba(160, 120, 108, 0.45);
      animation: spark 1.15s ease-out forwards;
    }

    .curtain.open .left { transform: translateX(-105%); }
    .curtain.open .right { transform: translateX(105%); }
    .curtain.open .curtain-valance { transform: translateY(-110%); }
    .curtain.open .curtain-mark { opacity: 0; }

    @keyframes spark {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(160deg) scale(0.35);
        opacity: 0;
      }
    }

    .text-btn {
      border: 0;
      padding: 0;
      background: none;
      color: var(--soft);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .play-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .music {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin: 0 0 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #1b1a17;
      color: var(--text);
    }

    .music small { color: var(--muted); font-size: 12px; }

    .music[aria-pressed="true"] { border-color: rgba(196, 132, 92, 0.7); }

    .chase {
      position: relative;
      width: 156px;
      height: 68px;
      flex: 0 0 156px;
    }

    .butterfly,
    .dog {
      position: absolute;
      overflow: visible;
    }

    .butterfly {
      width: 36px;
      height: 28px;
      animation: flutter 2.8s ease-in-out infinite;
    }

    .wings {
      transform-origin: 18px 14px;
      animation: flap 0.22s ease-in-out infinite;
    }

    .dog {
      width: 58px;
      height: 46px;
      bottom: 0;
      animation: pursue 2.8s ease-in-out infinite;
    }

    @keyframes flap {
      50% { transform: scaleY(0.45); }
    }

    @keyframes flutter {
      0% { transform: translate(6px, 20px) scaleX(1); }
      18% { transform: translate(46px, 2px) scaleX(1); }
      40% { transform: translate(104px, 14px) scaleX(1); }
      52% { transform: translate(98px, 6px) scaleX(-1); }
      74% { transform: translate(42px, 0) scaleX(-1); }
      100% { transform: translate(6px, 20px) scaleX(1); }
    }

    @keyframes pursue {
      0% { transform: translate(0, 0) scaleX(1); }
      12% { transform: translate(16px, -5px) scaleX(1); }
      24% { transform: translate(34px, 0) scaleX(1); }
      36% { transform: translate(54px, -5px) scaleX(1); }
      48% { transform: translate(74px, 0) scaleX(1); }
      62% { transform: translate(56px, -5px) scaleX(-1); }
      76% { transform: translate(34px, 0) scaleX(-1); }
      88% { transform: translate(14px, -5px) scaleX(-1); }
      100% { transform: translate(0, 0) scaleX(1); }
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      max-width: min(360px, calc(100% - 32px));
      margin: 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: #24211e;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    dialog:not([open]) { display: none !important; }

    dialog {
      width: min(560px, calc(100% - 24px));
      max-height: min(92vh, 880px);
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #181715;
      color: var(--text);
    }

    dialog::backdrop { background: rgba(8, 7, 6, 0.78); }

    #lightbox[open] {
      display: flex;
      flex-direction: column;
      width: min(1080px, calc(100vw - 16px));
      height: calc(100vh - 16px);
      max-height: calc(100vh - 16px);
      overflow: hidden;
      padding: 12px 14px 14px;
    }

    #lightbox figure {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin: 10px 0 0;
    }

    .lb-photo {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .lb-bar button,
    .quiet,
    .primary,
    .danger {
      border-radius: 999px;
      padding: 8px 14px;
    }

    .lb-bar button,
    .quiet {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    #lightbox .frame {
      min-height: 0;
      max-width: 100%;
      max-height: 100%;
    }

    #lb-img {
      max-width: 100%;
      max-height: calc(100vh - 240px);
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #lightbox figcaption { flex: 0 0 auto; }

    #lb-name {
      margin: 14px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
    }

    #lb-costume { margin: 4px 0 0; color: #c4a090; }

    #lb-caption {
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 18px;
      line-height: 1.45;
    }

    #lb-sender { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    dialog h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 30px;
    }

    .hint { margin: 8px 0 0; color: var(--muted); }

    form, .stack { display: grid; gap: 12px; margin-top: 16px; }

    label { display: grid; gap: 6px; color: var(--soft); font-size: 13px; }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #12110f;
      color: var(--text);
      font: inherit;
    }

    textarea { min-height: 88px; resize: vertical; }

    .drop {
      position: relative;
      display: grid;
      place-items: center;
      gap: 8px;
      min-height: 140px;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(243, 236, 228, 0.28);
      background: #12110f;
      text-align: center;
      color: var(--muted);
    }

    .drop input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop img {
      position: relative;
      z-index: 1;
      max-height: 180px;
      object-fit: contain;
      pointer-events: none;
      border-radius: 10px;
    }

    .drop span { position: relative; z-index: 1; pointer-events: none; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .primary {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      font-weight: 600;
    }

    .danger {
      background: transparent;
      color: #e7b2a4;
      border: 1px solid rgba(231, 178, 164, 0.35);
    }

    .form-error { margin: 0; color: #e7b2a4; }

    .manage { display: grid; gap: 10px; margin-top: 8px; }

    .manage h3 {
      margin: 8px 0 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--soft);
    }

    .row {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .row img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--frame);
    }

    .row p { margin: 0; }

    .row .who { font-family: Georgia, serif; font-size: 18px; }

    .row .mini { color: var(--muted); font-size: 13px; }

    .row-actions { display: flex; gap: 10px; margin-top: 4px; }

    .note { margin: 0; color: var(--muted); font-size: 13px; }

    @media (max-width: 640px) {
      .page { padding-top: 28px; }
      .name { font-size: 24px; }
      .toast { left: 16px; right: 16px; bottom: 16px; }
      footer { padding: 8px 96px 120px; }
      .ornament.tl { width: 130px; height: 156px; }
      .ornament.tr { width: 84px; height: 84px; }
      .ornament.bl { width: 150px; height: 100px; }
      .ornament.br { width: 58px; height: 96px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
      .butterfly,
      .dog,
      .wings { animation: none; }
      .butterfly { transform: translate(96px, 8px); }
      .dog { transform: translate(8px, 0); }
      .pumpkin,
      .stem,
      .stem,
      .eye,
      .flame,
      .kitty,
      .purr,
      .spark,
      .firefly,
      .spider,
      .sheet,
      .wick { animation: none; }
      .firefly { opacity: 0.75; }
      .purr { opacity: 0.8; }
      .curtain-panel,
      .curtain-valance,
      .curtain-mark { transition: none; }
    }
  </style>
</head>
<body class="curtain-on">
  <div class="curtain" id="curtain" role="button" tabindex="0" aria-label="кликни, чтобы созерцать">
    <div class="curtain-valance"></div>
    <div class="curtain-panel left"></div>
    <div class="curtain-panel right"></div>

  <p id="toast" class="toast" hidden role="status"></p>

  <dialog id="lightbox" aria-label="Фотография конкурсанта">
    <div class="lb-bar">
      <button type="button" id="lb-prev">Назад</button>
      <button type="button" id="lb-close">Закрыть</button>
      <button type="button" id="lb-next">Дальше</button>
    </div>
    <figure>
      <div class="lb-photo">
        <span class="frame">
          <img id="lb-img" alt="">
        </span>
      </div>
      <figcaption>
        <p id="lb-name"></p>
        <p id="lb-caption"></p>
        <p id="lb-sender"></p>
      </figcaption>
    </figure>
  </dialog>

  <script id="hall-data" type="application/json">[]</script>
  <script>
    var pets = [];
    var toastTimer = 0;
    var curtainGone = false;
    var audio = { ctx: null, timer: 0, playing: false };

    var MELODY = [
      "G5", "B5", "D6", "B5",
      "C6", "B5", "G5", "A5",
      "B5", "D6", "G5", "E5",
      "D5", "B4", "C5", "G5"
    ];
    var BASS = ["G2", "C3", "G2", "D3"];
    var PAD = ["G3", "C4", "G3", "D4"];
    var PAD5 = ["B3", "E4", "B3", "F#4"];

    function $(id) { return document.getElementById(id); }

    function tails(count) {
      var n10 = count % 10;
      var n100 = count % 100;
      if (n10 === 1 && n100 !== 11) return count + " хвостик";
      if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return count + " хвостика";
      return count + " хвостиков";
    }

    function safePhoto(src) {
      return /^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(src);
    }

    function makePet(fields) {
      return {
        id: fields.id,
        name: String(fields.name || "").trim(),
        caption: String(fields.caption || "").trim(),
        sender: String(fields.sender || "").trim(),
        photo: fields.photo,
        addedAt: fields.addedAt || 0
      };
    }

    function normalize(list) {
      if (!Array.isArray(list)) return [];
      return list.filter(function (pet) {
        return pet && typeof pet.id === "string" && safePhoto(pet.photo) && String(pet.name || "").trim() && String(pet.caption || "").trim();
      }).map(makePet);
    }

    function readPublished() {
      try {
        return normalize(JSON.parse($("hall-data").textContent));
      } catch (error) {
        return [];
      }
    }

    function sortedPets() {
      return pets.slice().sort(function (a, b) { return b.addedAt - a.addedAt; });
    }

    function showToast(message) {
      var toast = $("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.hidden = true; }, 4200);
    }

    function renderCount() {
      var count = $("count");
      if (!pets.length) {
        count.hidden = true;
        count.textContent = "";
        return;
      }
      count.hidden = false;
      count.textContent = "На стене " + tails(pets.length);
    }

    function ownerLine(pet) {
      return pet.sender ? "Хозяин: " + pet.sender : "";
    }

    function renderGallery() {
      var list = sortedPets();
      var gallery = $("gallery");
      gallery.textContent = "";
      var newestId = list[0] ? list[0].id : "";

      list.forEach(function (pet) {
        var item = document.createElement("li");
        item.className = "card";

        var button = document.createElement("button");
        button.type = "button";
        button.className = "open";
        button.addEventListener("click", function () { openLightbox(pet.id); });

        var frame = document.createElement("span");
        frame.className = "frame";
        var image = document.createElement("img");
        image.src = pet.photo;
        image.alt = pet.name + ". " + pet.caption;
        frame.appendChild(image);
        button.appendChild(frame);

        if (pets.length > 1 && pet.id === newestId) {
          var fresh = document.createElement("span");
          fresh.className = "fresh";
          fresh.textContent = "Новенький";
          button.appendChild(fresh);
        }

        var name = document.createElement("span");
        name.className = "name";
        name.textContent = pet.name;
        button.appendChild(name);

        var caption = document.createElement("span");
        caption.className = "caption";
        caption.textContent = pet.caption;
        button.appendChild(caption);

        var owner = ownerLine(pet);
        if (owner) {
          var from = document.createElement("span");
          from.className = "sender";
          from.textContent = owner;
          button.appendChild(from);
        }

        item.appendChild(button);
        gallery.appendChild(item);
      });
    }


    function render() {
      renderCount();
      renderGallery();
    }

    function openLightbox(id) {
      var list = sortedPets();
      var index = list.findIndex(function (pet) { return pet.id === id; });
      if (index < 0) return;
      var pet = list[index];
      $("lb-img").src = pet.photo;
      $("lb-img").alt = pet.name + ". " + pet.caption;
      $("lb-name").textContent = pet.name;
      $("lb-caption").textContent = pet.caption;
      $("lb-sender").textContent = ownerLine(pet);
      $("lb-prev").hidden = list.length < 2;
      $("lb-next").hidden = list.length < 2;
      $("lightbox").dataset.id = pet.id;
      if (!$("lightbox").open) $("lightbox").showModal();
    }

    function stepLightbox(step) {
      var list = sortedPets();
      if (list.length < 2) return;
      var current = $("lightbox").dataset.id;
      var index = list.findIndex(function (pet) { return pet.id === current; });
      var next = (index + step + list.length) % list.length;
      openLightbox(list[next].id);
    }

    function noteFreq(note) {
      var names = { C: 0, "C#": 1, D: 2, "D#": 3, E: 4, F: 5, "F#": 6, G: 7, "G#": 8, A: 9, "A#": 10, B: 11 };
      var pitch = note.slice(0, note.length - 1);
      var octave = Number(note.slice(-1));
      var midi = names[pitch] + (octave + 1) * 12;
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function tone(note, time, peak, attack, duration, output) {
      if (!note || time < audio.ctx.currentTime - 0.02) return;
      var start = Math.max(time, audio.ctx.currentTime + 0.01);
      var fundamental = audio.ctx.createOscillator();
      var warmth = audio.ctx.createOscillator();
      var mix = audio.ctx.createGain();
      var gain = audio.ctx.createGain();
      fundamental.type = "sine";
      warmth.type = "sine";
      fundamental.frequency.value = noteFreq(note);
      warmth.frequency.value = noteFreq(note);
      warmth.detune.value = 7;
      mix.gain.value = 0.4;
      fundamental.connect(gain);
      warmth.connect(mix);
      mix.connect(gain);
      gain.connect(output);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + attack + duration);
      fundamental.start(start);
      warmth.start(start);
      var stopAt = start + attack + duration + 0.06;
      fundamental.stop(stopAt);
      warmth.stop(stopAt);
    }

    function schedule(when) {
      if (!audio.playing) return;
      var step = 60 / 104;
      if (when < audio.ctx.currentTime + 0.05) when = audio.ctx.currentTime + 0.05;
      for (var i = 0; i < MELODY.length; i += 1) {
        var time = when + i * step;
        tone(MELODY[i], time, 0.055, 0.14, 0.82, audio.melody);
        if (i % 4 === 0) {
          var bar = i / 4;
          tone(BASS[bar], time, 0.04, 0.18, 1.7, audio.bass);
          tone(PAD[bar], time, 0.03, 0.22, 2.1, audio.pad);
          tone(PAD5[bar], time, 0.022, 0.22, 2.1, audio.pad);
        }
      }
      var next = when + MELODY.length * step;
      var wait = (next - audio.ctx.currentTime - 0.6) * 1000;
      audio.timer = setTimeout(function () { schedule(next); }, Math.max(80, wait));
    }

    function stopMusic() {
      audio.playing = false;
      clearTimeout(audio.timer);
      if (audio.ctx) {
        audio.ctx.close();
        audio.ctx = null;
      }
      $("music").setAttribute("aria-pressed", "false");
      $("music").setAttribute("aria-label", "Включить мелодию");
      $("music-label").textContent = "Шкатулка";
      $("tune").hidden = true;
    }

    function startMusic() {
      var Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) {
        showToast("В этом браузере шкатулка молчит.");
        return;
      }
      audio.ctx = new Context();
      audio.master = audio.ctx.createGain();
      audio.master.gain.setValueAtTime(0.0001, audio.ctx.currentTime);
      audio.master.gain.exponentialRampToValueAtTime(0.9, audio.ctx.currentTime + 0.4);
      audio.master.connect(audio.ctx.destination);

      audio.melody = audio.ctx.createGain();
      audio.melody.gain.value = 1;
      var soften = audio.ctx.createBiquadFilter();
      soften.type = "lowpass";
      soften.frequency.value = 1200;
      soften.Q.value = 0.4;
      var delay = audio.ctx.createDelay();
      delay.delayTime.value = 0.46;
      var feedback = audio.ctx.createGain();
      feedback.gain.value = 0.18;
      var wet = audio.ctx.createGain();
      wet.gain.value = 0.16;
      audio.melody.connect(soften);
      soften.connect(audio.master);
      soften.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(audio.master);

      audio.bass = audio.ctx.createGain();
      audio.bass.gain.value = 1;
      var lowpass = audio.ctx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 360;
      audio.bass.connect(lowpass);
      lowpass.connect(audio.master);

      audio.pad = audio.ctx.createGain();
      audio.pad.gain.value = 1;
      audio.pad.connect(audio.master);

      audio.playing = true;
      $("music").setAttribute("aria-pressed", "true");
      $("music").setAttribute("aria-label", "Выключить мелодию");
      $("music-label").textContent = "Играет";
      $("tune").hidden = false;
      schedule(audio.ctx.currentTime + 0.06);
    }

    function burstSparks() {
      var box = $("sparks");
      var colors = ["#2a1814", "#4a242c", "#3a221c", "#1c1412", "#5c3028", "#241418", "#6a4038"];
      for (var i = 0; i < 46; i += 1) {
        var spark = document.createElement("i");
        spark.className = "spark";
        spark.style.left = (42 + Math.random() * 16) + "%";
        spark.style.top = (36 + Math.random() * 28) + "%";
        spark.style.background = colors[i % colors.length];
        spark.style.width = (8 + (i % 5) * 2) + "px";
        spark.style.height = spark.style.width;
        spark.style.setProperty("--dx", (Math.random() * 80 - 40) + "vw");
        spark.style.setProperty("--dy", (Math.random() * 70 - 35) + "vh");
        spark.style.animationDelay = (Math.random() * 0.14) + "s";
        box.appendChild(spark);
      }
    }

    function openCurtain() {
      if (curtainGone) return;
      curtainGone = true;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) burstSparks();
      $("curtain").classList.add("open");
      document.body.classList.remove("curtain-on");
      setTimeout(function () { $("curtain").hidden = true; }, reduce ? 0 : 1200);
    }

    function bind() {
      $("curtain").addEventListener("click", openCurtain);
      $("curtain").addEventListener("keydown", function (event) {
        if (event.key === "Enter") openCurtain();
      });
      $("lb-close").addEventListener("click", function () { $("lightbox").close(); });
      $("lb-prev").addEventListener("click", function () { stepLightbox(-1); });
      $("lb-next").addEventListener("click", function () { stepLightbox(1); });
      $("lightbox").addEventListener("click", function (event) {
        if (event.target === $("lightbox")) $("lightbox").close();
      });
      document.addEventListener("keydown", function (event) {
        if (!curtainGone && (event.key === " " || event.key === "Spacebar")) {
          event.preventDefault();
          openCurtain();
          return;
        }
        if (!$("lightbox").open) return;
        if (event.key === "ArrowRight") stepLightbox(1);
        if (event.key === "ArrowLeft") stepLightbox(-1);
      });
      var purrFade = 0;
      var purrFading = false;
      function settlePurr(purr, perch) {
        purrFade += 1;
        purrFading = false;
        purr.pause();
        purr.currentTime = 0;
        purr.volume = 1;
        perch.classList.remove("purring");
        perch.setAttribute("aria-pressed", "false");
      }
      function fadePurr(purr, perch, andStop) {
        if (purrFading) return;
        purrFading = true;
        var id = ++purrFade;
        var from = purr.volume;
        var start = performance.now();
        perch.classList.remove("purring");
        perch.setAttribute("aria-pressed", "false");
        function step(now) {
          if (id !== purrFade) return;
          var t = Math.min(1, (now - start) / 1600);
          var eased = 1 - Math.pow(1 - t, 3);
          purr.volume = from * (1 - eased);
          if (t < 1) {
            requestAnimationFrame(step);
            return;
          }
          purrFading = false;
          if (andStop) settlePurr(purr, perch);
          else if (purr.paused || purr.ended) purr.volume = 1;
        }
        requestAnimationFrame(step);
      }
      $("perch-play").addEventListener("click", function () {
        var purr = $("purr-audio");
        var perch = $("perch-play");
        if (!purr.paused) {
          fadePurr(purr, perch, true);
          return;
        }
        purrFade += 1;
        purrFading = false;
        purr.volume = 1;
        purr.currentTime = 0;
        purr.play().then(function () {
          perch.classList.add("purring");
          perch.setAttribute("aria-pressed", "true");
        }).catch(function () {
          showToast("Мурчание не включилось. Нажми ещё раз.");
        });
      });
      $("purr-audio").addEventListener("timeupdate", function () {
        var purr = $("purr-audio");
        if (purr.paused || purrFading || !isFinite(purr.duration) || purr.duration < 2) return;
        if (purr.duration - purr.currentTime <= 1.6) fadePurr(purr, $("perch-play"), false);
      });
      $("purr-audio").addEventListener("ended", function () {
        var purr = $("purr-audio");
        purrFade += 1;
        purrFading = false;
        purr.volume = 1;
        $("perch-play").classList.remove("purring");
        $("perch-play").setAttribute("aria-pressed", "false");
      });
      $("music").addEventListener("click", function () {
        if (audio.playing) stopMusic();
        else startMusic();
      });
    }

    try { localStorage.removeItem("halloween-hall-draft-v1"); } catch (error) {}
    pets = readPublished();
    bind();
    render();
  </script>
</body>
